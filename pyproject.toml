[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-classifier"
version = "0.1.0"
description = "Personal Gmail spam classifier powered by TypeSafe Jev"
requires-python = ">=3.11"
dependencies = [
    # Stage 1: scaffold + Gmail auth + ingest
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "pydantic>=2.12.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    # Stage 2 (added when Stage 2 begins)
    # "beautifulsoup4>=4.12.0",
    # "lxml>=5.3.0",
    # Stage 3 (added when Stage 3 begins)
    # "typesafe-sdk>=0.7.0",
    # "fastapi>=0.115.0",
    # "httpx>=0.27.0",
    # Stage 4 (added when Stage 4 begins)
    # "opentelemetry-api>=1.29.0",
    # "opentelemetry-sdk>=1.29.0",
    # "opentelemetry-exporter-otlp>=1.29.0",
    # "prometheus-client>=0.21.0",
    # "structlog>=24.4.0",
    # "uvicorn>=0.32.0",
]

[project.scripts]
email-classifier = "email_classifier.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["email_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
